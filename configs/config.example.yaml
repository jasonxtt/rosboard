listen_address: ":8080"
data_dir: "./data"
poll_interval_seconds: 10
realtime_poll_interval_seconds: 1
terminal_poll_interval_seconds: 3
sample_retention_hours: 48
allowed_cidrs:
  - "127.0.0.0/8"
  - "::1/128"
  - "10.0.0.0/8"
  - "192.168.0.0/16"

devices:
  - id: "default"
    name: "主路由"
    enabled: true
    routeros:
      base_url: "http://10.0.0.1:80"
      username: "replace-me"
      password: "replace-me"
      traffic_interfaces:
        - "pppoe-out1"
      terminal_cidrs: []
