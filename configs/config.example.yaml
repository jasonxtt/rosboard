listen_address: ":8080"
data_dir: "./data"
poll_interval_seconds: 10
realtime_poll_interval_seconds: 1
terminal_poll_interval_seconds: 5
sample_retention_hours: 48
# 识别设置（协议分析 / MosDNS）全部按设备配置：
# devices:
#   - id: ros-a
#     name: ROS A
#     enabled: true
#     routeros: { ... }
#     protocol_analysis: true
#     mosdns:
#       enabled: true
#       base_url: "http://10.0.0.3"
#       sync_interval_minutes: 5
#       match_window_minutes: 30
allowed_cidrs:
  - "127.0.0.0/8"
  - "::1/128"
  - "10.0.0.0/8"
  - "192.168.0.0/16"
# Optional: if an HTTPS reverse proxy terminates TLS before forwarding to
# rosboard, set this to true to trust forwarded origin headers from any proxy
# peer. Requests without forwarding headers remain direct requests, so LAN IP
# access continues to work. Use this only when the listener is protected by a
# controlled proxy path. Omitted/false preserves direct-connection behavior.
# trusted_proxy_cidrs: true
#
# For stricter source-address verification, a CIDR list is also supported:
# trusted_proxy_cidrs:
#   - "127.0.0.1/32"
