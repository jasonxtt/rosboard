listen_address: ":8080"
data_dir: "./data"
poll_interval_seconds: 10
realtime_poll_interval_seconds: 1
terminal_poll_interval_seconds: 5
sample_retention_hours: 48
mosdns:
  enabled: true
  base_url: "http://10.0.0.3"
  sync_interval_minutes: 30
feature_library:
  enabled: true
  source_url: "https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat_plain.yml"
  refresh_interval_hours: 168
  match_window_minutes: 30
allowed_cidrs:
  - "127.0.0.0/8"
  - "::1/128"
  - "10.0.0.0/8"
  - "192.168.0.0/16"
