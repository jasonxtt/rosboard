<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <title>Rosboard · RouterOS 监控</title>
    <script type="module" crossorigin src="./assets/index-BbkQnFf2.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B-9KpvNW.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const retryKey = 'rosboard:boot-retries'
        window.setTimeout(() => {
          const root = document.getElementById('root')
          if (root && root.childElementCount === 0) {
            const retries = Number(window.sessionStorage.getItem(retryKey) || '0')
            if (retries < 3) {
              window.sessionStorage.setItem(retryKey, String(retries + 1))
              window.location.reload()
            }
            return
          }
          window.sessionStorage.removeItem(retryKey)
        }, 2000)
      })()
    </script>
  </body>
</html>
