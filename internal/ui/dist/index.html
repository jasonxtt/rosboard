    <title>rosboard</title>
    <script type="module" crossorigin src="./assets/index-CcisHmNf.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/useShell-DKpKS3I0.js">
    <link rel="stylesheet" crossorigin href="./assets/index-W8pe213c.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const retryKey = 'rosboard:boot-retries'
        window.setTimeout(() => {
          const root = document.getElementById('root')
          if (root && root.childElementCount === 0) {
            const retries = Number(window.sessionStorage.getItem(retryKey) || '0')
            if (retries < 3) {
              window.sessionStorage.setItem(retryKey, String(retries + 1))
              window.location.reload()
            }
            return
          }
          window.sessionStorage.removeItem(retryKey)
        }, 2000)
      })()
    </script>
  </body>
</html>
