name: Docker

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  pull_request:
    paths:
      - VERSION
      - Dockerfile
      - .dockerignore
      - docker-compose*.yml.example
      - .github/workflows/docker.yml
      - web/**
      - cmd/**
      - internal/**
      - go.mod
      - go.sum

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read version and build metadata
        id: meta
        shell: bash
        env:
          HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must contain a semantic version such as 0.0.1" >&2
            exit 1
          fi
          built_at="$HEAD_COMMIT_TIMESTAMP"
          if [[ -z "$built_at" ]]; then
            built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "built_at=$built_at" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          provenance: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
          tags: |
            jasonxtt/rosboard:v${{ steps.meta.outputs.version }}
            jasonxtt/rosboard:${{ steps.meta.outputs.version }}
            jasonxtt/rosboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
